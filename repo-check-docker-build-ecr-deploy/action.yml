name: Check repo, build, deploy to ecr
# A workflow to build and release the latest code in container to AWS ECR designed for tna-judgments-parser
# The latest tag is retrieved from the GitHub repository
# Checks if the ECR exists and creates if required
# Checks to see if version has been deployed (a version in ECR has same tag as latest from GitHub
# If not deployed gets the latest pushed ECR version
# Check if the version should be deployed
# Builds and pushes image version if required
# If a branch is given, that branch is built as a test build with a branch-* tag instead; no upgrade checks apply

# Controls when the workflow will run
description: Checks a repo latest tag, then builds and deploy to ecr if required

inputs:
  repository_name:
    description: name of repository
    required: true
    type: string
    default: "nationalarchives/tna-judgments-parser"
  ecr_registry_path:
    type: string
    required: true
    default: "tre-v2/tna-judgments-parser"
  docker_file:
    type: string
    required: false
    default: "TRE/DockerfileV2"
  aws_role:
    type: string
    required: true
  wiz-client-id:
    type: string
    required: true
  wiz-client-secret:
    type: string
    required: true
  wiz-project-tre:
    type: string
    required: true
  sixlabors-license-key:
    description: "Optional Six Labors licence key passed to the Docker build action"
    required: false
  branch:
    description: "Optional. Branch of the repository to build as a test build, instead of the latest release tag. The image is tagged branch-<branch>-<commit>. If that tag is already in ECR the existing image is reused and nothing is built. The latest ECR version and upgrade checks are skipped"
    type: string
    required: false
outputs:
  version:
    description: version to update
    value: ${{ steps.build_target.outputs.tag }}
runs:
  using: composite
  # Steps represent a sequence of tasks that will be executed as part of the job
  steps: # Checks latest tag in repository
    - name: Get latest repository tag
      if: ${{ inputs.branch == '' }}
      uses: oprypin/find-latest-tag@dd2729fe78b0bb55523ae2b2a310c6773a652bd1
      id: latest_git_tag
      with:
        repository: ${{ inputs.repository_name }}
    # Releases build the latest GitHub tag; if branch is given that branch is built instead.
    # Outputs the git ref to check out, the image tag, and whether this is a release build
    - name: Work out ref and image tag to build
      id: build_target
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository_name }}
        BRANCH: ${{ inputs.branch }}
        LATEST_TAG: ${{ steps.latest_git_tag.outputs.tag }}
      run: |
        if [ -z "${BRANCH}" ]; then
          if [ -z "${LATEST_TAG}" ]; then
            echo "::error::No version to build"
            exit 1
          fi
          echo "use_latest_git_tag=true" >> "$GITHUB_OUTPUT"
          echo "ref=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Resolve the branch to a commit now, so the commit that is built is the one that is tagged
        commit="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${BRANCH}" | cut -f1)"
        if [ -z "${commit}" ]; then
          echo "::error::Branch '${BRANCH}' not found in ${REPOSITORY}"
          exit 1
        fi
        # Lower-case, replace anything outside [a-z0-9] with '-', collapse repeats, trim, cap the length
        slug="$(printf '%s' "${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')"
        # The tag identifies the commit, so an unchanged branch reuses its image
        version="branch-${slug}-${commit:0:7}"
        echo "use_latest_git_tag=false" >> "$GITHUB_OUTPUT"
        echo "ref=${commit}" >> "$GITHUB_OUTPUT"
        echo "tag=${version}" >> "$GITHUB_OUTPUT"
        {
          echo "### Branch build"
          echo "- Repository: \`${REPOSITORY}\`"
          echo "- Branch: \`${BRANCH}\`"
          echo "- Commit: \`${commit}\`"
          echo "- Image tag: \`${version}\`"
        } >> "$GITHUB_STEP_SUMMARY"
    # The repo must exist before it can be checked
    - name: create ecr repo if required
      id: create-ecr-repo
      uses: nationalarchives/da-tre-github-actions/create-ecr-repository@1629bcbfc39177a2a175455ddbb7cb3a07b15ff2 # 0.0.94
      with:
        ecr_registry_path: "${{inputs.ecr_registry_path}}"
        aws-role: "${{ inputs.aws_role }}"
    # Check if the version has been deployed steps.deployed.outputs.version-deployed == 1 if deployed
    - name: version deployed
      id: deployed
      uses: nationalarchives/da-tre-github-actions/version-deployed@1629bcbfc39177a2a175455ddbb7cb3a07b15ff2 # 0.0.94
      with:
        ecr_registry_path: "${{inputs.ecr_registry_path}}"
        new-tag: "${{ steps.build_target.outputs.tag }}"
        aws-role: "${{ inputs.aws_role }}"
    # A release that is already deployed stops here; a branch build that is already in ECR
    # (same commit) reuses the image and skips the build
    - name: stop if release deployed
      id: ecr_check
      shell: bash
      env:
        ECR_REGISTRY_PATH: ${{ inputs.ecr_registry_path }}
        ECR_CREATED: ${{ steps.create-ecr-repo.outputs.created }}
        IMAGE_VERSION: ${{ steps.build_target.outputs.tag }}
        VERSION_DEPLOYED: ${{ steps.deployed.outputs.version-deployed }}
        USE_LATEST_GIT_TAG: ${{ steps.build_target.outputs.use_latest_git_tag }}
      run: |
        echo "registry ${ECR_REGISTRY_PATH} created ${ECR_CREATED}"
        echo "version ${IMAGE_VERSION} deployed  ${VERSION_DEPLOYED}"
        if [ "${VERSION_DEPLOYED}" -eq 1 ]; then
          if [ "${USE_LATEST_GIT_TAG}" = "true" ]; then exit 1; fi
          echo "Image ${IMAGE_VERSION} is already in ECR, skipping the build"
          echo "build_needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "build_needed=true" >> "$GITHUB_OUTPUT"
        fi
    # Get the latest pushed version
    - name: get latest ecr version released
      if: ${{ steps.build_target.outputs.use_latest_git_tag == 'true' }}
      id: latest-ecr-version-tag
      uses: nationalarchives/da-tre-github-actions/latest-ecr-version@1629bcbfc39177a2a175455ddbb7cb3a07b15ff2 # 0.0.94
      with:
        ecr_registry_path: "${{inputs.ecr_registry_path}}"
        aws-role: "${{ inputs.aws_role }}"
    - name: ok to update
      if: ${{ steps.build_target.outputs.use_latest_git_tag == 'true' }}
      id: update_okay
      uses: nationalarchives/da-tre-github-actions/update-allowed@1629bcbfc39177a2a175455ddbb7cb3a07b15ff2 # 0.0.94
      with:
        current-tag: "${{steps.latest-ecr-version-tag.outputs.latest-version}}"
        new-tag: "${{ steps.build_target.outputs.tag }}"
    - name: Checkout
      if: ${{ steps.ecr_check.outputs.build_needed == 'true' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ${{ inputs.repository_name }}
        ref: ${{ steps.build_target.outputs.ref }}
    # This workflow takes a registry path tre_v2/image_name  the must be split for docker build action
    - name: Split registry
      if: ${{ steps.ecr_check.outputs.build_needed == 'true' }}
      id: registry
      shell: bash
      env:
        ECR_REGISTRY_PATH: ${{ inputs.ecr_registry_path }}
      run: |
        echo "image-name=$(cut -d'/' -f2 <<< "${ECR_REGISTRY_PATH}")" >> $GITHUB_OUTPUT
        echo "ecr-registry-path=$(cut -d'/' -f1 <<< "${ECR_REGISTRY_PATH}")" >> $GITHUB_OUTPUT
    - name: login
      if: ${{ steps.ecr_check.outputs.build_needed == 'true' }}
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
      with:
        role-to-assume: ${{ inputs.aws_role }}
        aws-region: eu-west-2
        role-session-name: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
    - name: build and push
      if: ${{ steps.ecr_check.outputs.build_needed == 'true' }}
      uses: nationalarchives/da-tre-github-actions/.github/actions/docker-build-and-deploy-to-ecr@1629bcbfc39177a2a175455ddbb7cb3a07b15ff2 # 0.0.94
      with:
        ecr-registry-path: "${{steps.registry.outputs.ecr-registry-path}}"
        docker-file: "${{inputs.docker_file}}"
        sixlabors-license-key: ${{ inputs.sixlabors-license-key }}
        dockerfile-dir: "."
        image-name: "${{steps.registry.outputs.image-name}}"
        aws-region: "eu-west-2"
        image-version: "${{ steps.build_target.outputs.tag }}"
        wiz-client-id: "${{inputs.wiz-client-id }}"
        wiz-client-secret: "${{inputs.wiz-client-secret }}"
        wiz-project-tre: "${{inputs.wiz-project-tre}}"

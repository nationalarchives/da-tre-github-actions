# Action to get latest pushed image
name: "Get latest deployed"
description: "Gets the tag of the latest pushed release image, or 0.0.0 if there is none"
inputs:
  ecr_registry_path:
    type: string
    required: true
  aws-role:
    required: true
    description: "AWS role allowed to read ECR"
outputs:
  latest-version:
    description: latest version
    value: ${{ steps.latest.outputs.latest-version }}
runs:
  using: "composite"
  steps:
    - name: login
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: eu-west-2
        role-session-name: github-actions-${{ github.run_id }}-${{ github.run_attempt }}

    # Only images tagged with a version number are release images; others (e.g. test builds of branches)
    # are not versions and cannot be compared by update-allowed
    - name: Get latest release version
      id: latest
      shell: bash
      env:
        ECR_REGISTRY_PATH: ${{ inputs.ecr_registry_path }}
        VERSION_REGEX: '^v?[0-9]+(\.[0-9]+){0,2}$'
      run: |
        latest="$(aws ecr describe-images --repository-name "${ECR_REGISTRY_PATH}" --filter tagStatus=TAGGED --output json \
          | jq -r --arg re "${VERSION_REGEX}" '
              [.imageDetails[] | select(any(.imageTags[]?; test($re)))]
              | sort_by(.imagePushedAt) | last
              | (.imageTags // []) | map(select(test($re))) | first // "0.0.0"')"
        echo "latest-version=${latest}" >> "$GITHUB_OUTPUT"
